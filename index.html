<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ágora Vermelha - Agregador de Conteúdo e Fórum Progressista</title>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Identity Services (Google Auth) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <!-- Cropper.js JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- Configuração do Tailwind -->
  <script src="frontend/js/tailwind-config.js"></script>

  <!-- Estilos da aplicação -->
  <link rel="stylesheet" href="frontend/css/theme.css">
  <link rel="stylesheet" href="frontend/css/base.css">
  <link rel="stylesheet" href="frontend/css/tokens.css">
  <link rel="stylesheet" href="frontend/css/typography.css">
  <link rel="stylesheet" href="frontend/css/feed.css">
  <link rel="stylesheet" href="frontend/css/toast.css">
  <link rel="stylesheet" href="frontend/css/composer.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row antialiased">

  <!-- ==================== MENU LATERAL (SIDEBAR) ==================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 surface-card border-r border-token transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out flex flex-col justify-between">
    <div>
      <div class="h-20 flex items-center justify-between px-6 border-b border-token">
        <a href="#" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-brand text-white flex items-center justify-center font-bold text-lg shadow-sm">
            Á
          </div>
          <span class="font-logo tracking-tight text-primary-token">Ágora<span class="brand-accent">.</span></span>
        </a>
        <button id="closeSidebarBtn" class="md:hidden text-secondary-token hover:text-primary-token p-2 rounded-lg" aria-label="Fechar menu">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <nav class="p-4 space-y-1.5" aria-label="Navegação Principal">
        <a href="#" onclick="filterPosts('todos', this)" class="nav-item active flex items-center gap-3 px-4 py-3 text-sm font-semibold rounded-xl bg-slate-100 dark:bg-zinc-800 text-primary-token transition-colors">
          <i class="fa-solid fa-house brand-accent text-base"></i>
          <span>Principal</span>
        </a>
        <a href="#" onclick="filterPosts('Notícias', this)" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl text-secondary-token hover:bg-slate-100 dark:hover:bg-zinc-800/60 hover:text-primary-token transition-colors">
          <i class="fa-solid fa-newspaper text-base"></i>
          <span>Notícias</span>
        </a>
        <a href="#" onclick="filterPosts('Debates', this)" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl text-secondary-token hover:bg-slate-100 dark:hover:bg-zinc-800/60 hover:text-primary-token transition-colors">
          <i class="fa-solid fa-comments text-base"></i>
          <span>Debates</span>
        </a>
        <a href="#" onclick="filterPosts('Mais Avaliados', this)" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl text-secondary-token hover:bg-slate-100 dark:hover:bg-zinc-800/60 hover:text-primary-token transition-colors">
          <i class="fa-solid fa-fire text-base"></i>
          <span>Tópicos Em Alta</span>
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-token space-y-3">
      <div class="p-3 rounded-xl bg-red-50 dark:bg-zinc-800/80 border border-red-100 dark:border-zinc-700">
        <p class="font-caption brand-accent font-semibold flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved"></i> Espaço Progressista
        </p>
        <p class="font-caption text-secondary-token mt-1">Junte-se à construção de um debate público plural, ético e democrático.</p>
      </div>
      <p class="font-caption text-secondary-token text-center">&copy; 2026 Ágora Vermelha</p>
    </div>
  </aside>

  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden backdrop-blur-sm"></div>

  <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
  <div class="flex-1 md:ml-64 flex flex-col min-h-screen">

    <!-- CABEÇALHO (HEADER) -->
    <header class="sticky top-0 z-20 surface-card/90 backdrop-blur-md border-b border-token px-4 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <button id="openSidebarBtn" class="md:hidden p-2 rounded-xl text-secondary-token hover:bg-slate-100 dark:hover:bg-zinc-800" aria-label="Abrir Menu">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        
        <a href="#" class="flex items-center gap-2">
          <span class="font-logo tracking-tight text-primary-token">Ágora<span class="brand-accent">Vermelha</span></span>
        </a>
      </div>

      <div class="hidden sm:flex flex-1 max-w-md mx-4 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary-token text-xs"></i>
        <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Buscar notícias, artigos e debates..." class="w-full pl-9 pr-4 py-2 rounded-xl border border-token surface-card text-xs text-primary-token placeholder:text-secondary-token focus:outline-none focus:ring-2 focus:ring-red-500/30 transition-all">
      </div>

      <div class="flex items-center gap-2.5">

        <button id="manageInvitesBtn" onclick="openManageInvitesModal()" class="hidden items-center gap-2 surface-card hover:bg-slate-100 dark:hover:bg-zinc-800 border border-token text-primary-token font-semibold px-3.5 py-2 rounded-xl text-xs transition-all shadow-sm active:scale-95" title="Gerenciar convites e permissões">
          <i class="fa-solid fa-users-gear text-brand"></i>
          <span class="hidden sm:inline">Gestão</span>
        </button>

        <button id="inviteBtn" onclick="openInviteModal()" class="hidden items-center gap-2 bg-brand/10 hover:bg-brand/20 text-brand border border-brand/30 font-semibold px-3.5 py-2 rounded-xl text-xs transition-all shadow-sm active:scale-95" title="Convidar novos membros">
          <i class="fa-solid fa-user-plus"></i>
          <span class="hidden sm:inline">Convidar</span>
        </button>

        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl border border-token text-secondary-token hover:text-primary-token hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors" title="Alternar Tema Claro/Escuro" aria-label="Alternar Tema">
          <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
        </button>

        <!-- Botão Entrar / Container de Usuário Logado -->
        <div id="userHeaderContainer">
          <button id="loginBtn" onclick="openLoginModal()" class="flex items-center gap-2 bg-brand hover:opacity-90 text-white font-medium px-4 py-2 rounded-xl text-xs sm:text-sm transition-all shadow-sm active:scale-95">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span class="hidden sm:inline">Entrar / Cadastrar</span>
            <span class="sm:hidden">Entrar</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ÁREA DE FEED -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 md:py-8 space-y-6">

      <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1 no-scrollbar">
        <div class="flex items-center gap-2">
          <button onclick="filterPosts('todos', this)" class="filter-tab active text-xs font-semibold px-4 py-2 rounded-xl bg-brand text-white transition-all">
            Todos
          </button>
          <button onclick="filterPosts('Notícias', this)" class="filter-tab text-xs font-medium px-4 py-2 rounded-xl surface-card border border-token text-secondary-token hover:text-primary-token transition-all">
            Notícias
          </button>
          <button onclick="filterPosts('Debates', this)" class="filter-tab text-xs font-medium px-4 py-2 rounded-xl surface-card border border-token text-secondary-token hover:text-primary-token transition-all">
            Debates
          </button>
          <button onclick="filterPosts('Mais Avaliados', this)" class="filter-tab text-xs font-medium px-4 py-2 rounded-xl surface-card border border-token text-secondary-token hover:text-primary-token transition-all">
            Mais Avaliados
          </button>
        </div>
      </div>

      <div id="postsFeed" class="space-y-6">
        <div class="surface-card rounded-2xl p-6 border border-token shadow-sm animate-pulse space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-200 dark:bg-zinc-700"></div>
            <div class="space-y-2 flex-1">
              <div class="h-4 bg-slate-200 dark:bg-zinc-700 rounded w-1/3"></div>
              <div class="h-3 bg-slate-100 dark:bg-zinc-800 rounded w-1/4"></div>
            </div>
          </div>
          <div class="h-36 bg-slate-100 dark:bg-zinc-800 rounded-xl"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- ==================== BOTÃO FLUTUANTE: NOVA PUBLICAÇÃO ==================== -->
  <button id="newPostFab" onclick="openPostComposer()" class="new-post-fab z-20 w-14 h-14 rounded-full bg-brand text-white shadow-xl hover:opacity-90 hover:scale-105 active:scale-95 transition-all flex items-center justify-center" title="Nova publicação" aria-label="Nova publicação">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- ==================== TELAS CARREGADAS SOB DEMANDA ====================
       Modais e painéis (pasta partials/) são inseridos aqui quando a
       funcionalidade correspondente é acionada. Fica antes do toast para
       que o toast sempre apareça por cima. -->
  <div id="modalRoot"></div>

  <!-- ==================== TOAST DE NOTIFICAÇÃO ==================== -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-zinc-900 text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 transform translate-y-16 opacity-0 pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-check brand-accent text-base"></i>
    <span id="toastMessage">Ação concluída com sucesso!</span>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="frontend/js/core/config.js"></script>
  <script src="frontend/js/core/state.js"></script>
  <script src="frontend/js/core/utils.js"></script>
  <script src="frontend/js/core/view-loader.js"></script>
  <script src="frontend/js/core/location.js"></script>
  <script src="frontend/js/features/theme.js"></script>
  <script src="frontend/js/features/layout.js"></script>
  <script src="frontend/js/features/feed.js"></script>
  <script src="frontend/js/features/share.js"></script>
  <script src="frontend/js/features/auth.js"></script>
  <script src="frontend/js/features/profile.js"></script>
  <script src="frontend/js/features/avatar.js"></script>
  <script src="frontend/js/features/invites.js"></script>
  <script src="frontend/js/features/pending-invite.js"></script>
  <script src="frontend/js/features/manage-invites.js"></script>
  <script src="frontend/js/features/notifications.js"></script>
  <script src="frontend/js/features/admin-notifications.js"></script>
  <script src="frontend/js/features/post-link-preview.js"></script>
  <script src="frontend/js/features/post-composer.js"></script>
  <script src="frontend/js/main.js"></script>
</body>
</html>
