  <!-- ==================== MODAL DE ENVIO DE NOTIFICAÇÃO MANUAL ==================== -->
  <div id="sendNotificationModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="surface-card border border-token rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl relative">
      <button onclick="closeSendNotificationModal()" class="absolute top-4 right-4 text-secondary-token hover:text-primary-token p-2 rounded-full">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="mb-5">
        <div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/30 text-amber-600 flex items-center justify-center mb-3 text-xl font-bold">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="font-h1 text-primary-token text-base font-bold">Enviar Notificação ao Usuário</h3>
        <p id="targetUserNameLabel" class="font-caption text-secondary-token mt-0.5">Destinatário: -</p>
      </div>

      <form id="sendNotificationForm" onsubmit="handleSendCustomNotification(event)" class="space-y-4">
        <input type="hidden" id="targetNotificationUserId">

        <!-- Tipo de Notificação -->
        <div>
          <label class="block font-caption font-semibold text-primary-token mb-1">Tipo de Notificação</label>
          <select id="notificationTypeSelect" required class="w-full px-3.5 py-2.5 rounded-xl border border-token surface-card text-xs text-primary-token focus:outline-none focus:ring-2 focus:ring-red-500/20">
            <option value="Notificação">Notificação</option>
            <option value="Alerta">Alerta</option>
            <option value="Advertência">Advertência</option>
          </select>
        </div>

        <!-- Mensagem com Contador -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block font-caption font-semibold text-primary-token">Mensagem</label>
            <span id="customNotifCounter" class="font-caption text-xs text-secondary-token">0/255</span>
          </div>
          <textarea id="notificationMessageInput" maxlength="255" oninput="updateCustomNotifCounter()" rows="4" required placeholder="Digite a mensagem que será exibida para o usuário..." class="w-full p-3 rounded-xl border border-token surface-card text-primary-token text-xs leading-relaxed focus:outline-none focus:ring-2 focus:ring-red-500/20 resize-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-brand hover:opacity-90 text-white font-medium py-2.5 rounded-xl text-xs sm:text-sm transition-all shadow-md">
          Enviar Notificação
        </button>
      </form>
    </div>
  </div>
