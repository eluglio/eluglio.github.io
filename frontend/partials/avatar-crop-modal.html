  <!-- ==================== MODAL: CORTE LIVRE E EDIÇÃO DA FOTO ==================== -->
  <div id="avatarCropModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
    <div class="surface-card border border-token rounded-3xl max-w-lg w-full p-6 shadow-2xl relative flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-h1 text-primary-token text-base font-bold">Cortar Foto de Perfil</h3>
        <button onclick="closeAvatarCropModal()" class="text-secondary-token hover:text-primary-token p-1 rounded-full">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto space-y-4">
        <!-- Área inicial de seleção / arrastar e soltar -->
        <div id="dropArea" class="flex flex-col items-center justify-center border-2 border-dashed border-token rounded-2xl p-8 text-center cursor-pointer hover:border-brand transition-colors" onclick="document.getElementById('avatarFileInput').click()">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-secondary-token mb-2 pointer-events-none"></i>
          <span class="font-caption text-xs text-primary-token font-medium pointer-events-none">
            Clique para selecionar ou arraste uma imagem aqui
          </span>
          <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
        </div>

        <!-- Container do Cropper (Oculto inicialmente até carregar a imagem) -->
        <div id="cropperContainer" class="hidden flex flex-col items-center space-y-3">
          <div class="w-full max-h-[350px] overflow-hidden flex justify-center bg-black/10 rounded-xl">
            <!-- A imagem que será manipulada pelo Cropper -->
            <img id="imageToCrop" src="" alt="Cortar Imagem" class="max-w-full block">
          </div>
          <p class="font-caption text-xs text-secondary-token text-center">Arraste os cantos ou mova a imagem para ajustar o corte circular.</p>
          
          <button onclick="cropAndUploadAvatar()" class="w-full bg-brand hover:opacity-90 text-white font-medium py-2.5 rounded-xl text-xs sm:text-sm transition-all shadow-md">
            Recortar e Salvar Foto
          </button>
        </div>
      </div>
    </div>
  </div>
