  <!-- ==================== MODAL DE ALERTA DE CONVITE PENDENTE ==================== -->
  <div id="pendingInviteModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm hidden">
    <div class="surface-card border border-token rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center relative">
      
      <div class="w-12 h-12 rounded-2xl bg-brand/10 text-brand flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-award"></i>
      </div>

      <h3 class="font-h1 text-primary-token text-base font-bold mb-1">Novo Convite de Acesso</h3>
      <p id="pendingInviteText" class="font-caption text-secondary-token mb-6">
        Você recebeu um convite para atualizar seu nível na plataforma.
      </p>

      <div class="flex gap-3">
        <button onclick="respondPendingInvite('decline')" class="flex-1 py-2.5 rounded-xl border border-token text-secondary-token hover:bg-slate-100 dark:hover:bg-zinc-800 text-xs font-semibold transition-all">
          Recusar
        </button>
        <button onclick="respondPendingInvite('accept')" class="flex-1 bg-brand hover:opacity-90 text-white py-2.5 rounded-xl text-xs font-semibold transition-all shadow-md">
          Aceitar Convite
        </button>
      </div>
    </div>
  </div>
